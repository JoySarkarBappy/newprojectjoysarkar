name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unlock the signing key
        env:
          SROT_SIGNING_PASSWORD: ${{ secrets.SROT_SIGNING_PASSWORD }}
        run: bash ci/signing.sh
      - name: Unit tests and APKs
        env:
          SROT_SIGNING_PASSWORD: ${{ secrets.SROT_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-x86_64
          path: android/app/build/outputs/apk/release/app-x86_64-release.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: android/app/build/reports/tests

  android-emulator:
    name: Android emulator test
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-x86_64
          path: android/apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use Srot on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: android
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/emulator-test.sh apks/app-x86_64-release.apk ci-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: android/ci-out

  mac-package:
    name: Mac build
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build, then check the signature and that the app starts
        run: |
          bash scripts/package-mac.sh arm64
          APP=dist/Srot-darwin-arm64/Srot.app
          codesign --verify --deep --strict "$APP" && echo "signature ok"
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|NSHumanReadableCopyright"
          "$APP/Contents/MacOS/Srot" --version >/dev/null 2>&1 & pid=$!; sleep 8; kill $pid 2>/dev/null || true
          echo "launch ok"

  windows-package:
    name: Windows build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build and check the contents
        run: |
          bash scripts/package-win.sh x64
          unzip -l dist/Srot-windows-x64.zip | grep -E "Srot/Srot.exe|resources/app/src/main/main.js|resources/app/extension/manifest.json"
