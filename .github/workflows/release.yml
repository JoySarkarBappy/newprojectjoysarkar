name: Release

# Change the version number in the VERSION file on main (or run this from the Actions tab) to build every
# version of Srot and publish them together on the Releases page.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

env:
  # SHA-256 of Srot's Android signing certificate. A release signed with any other key is refused.
  SROT_CERT_SHA256: 3683f0d63b9c0b8e40e59fc65b6deb6819af0a0498d1cdb562115324f9e64a5b

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unlock the signing key
        env:
          SROT_SIGNING_PASSWORD: ${{ secrets.SROT_SIGNING_PASSWORD }}
          REQUIRE_SIGNING: "1"
        run: bash ci/signing.sh
      - name: Unit tests and APKs
        env:
          SROT_SIGNING_PASSWORD: ${{ secrets.SROT_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Check the signature and name the files
        run: |
          mkdir -p ../out
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for abi in arm64-v8a armeabi-v7a universal; do
            f="app/build/outputs/apk/release/app-$abi-release.apk"
            "$APKSIGNER" verify --print-certs "$f" | grep -qi "SHA-256 digest: $SROT_CERT_SHA256" \
              || { echo "::error::$f is not signed with Srot's key"; exit 1; }
            cp "$f" "../out/Srot-android-$abi.apk"
          done
          ls -l ../out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  mac:
    name: Mac apps
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apple Silicon and Intel builds
        run: |
          mkdir -p ../out
          bash scripts/package-mac.sh arm64 && mv dist/Srot-mac-arm64.zip ../out/
          bash scripts/package-mac.sh x64 && mv dist/Srot-mac-x64.zip ../out/
          ls -l ../out
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/*.zip

  windows:
    name: Windows app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Build
        run: |
          mkdir -p ../out
          bash scripts/package-win.sh x64 && mv dist/Srot-windows-x64.zip ../out/
          ls -l ../out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.zip

  publish:
    name: Publish the release
    needs: [android, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Browser extension
        run: |
          mkdir -p ext
          cp -r desktop/extension "ext/Srot Browser Extension"
          (cd ext && zip -qr ../dist/Srot-browser-extension.zip "Srot Browser Extension")
          ls -l dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d ' \r\n' < VERSION)"
          echo "Publishing $TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Srot ${TAG#v}" \
              --notes-file .github/release-notes.md --repo "$GITHUB_REPOSITORY"
          fi
